<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phaser 2D Fighter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000000;
    }
    canvas {
      display: block;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
    #fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 240, 255, 0.45);
      color: #38bdf8;
      font-family: Impact, "Arial Black", system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      transition: all 0.2s ease;
      opacity: 0.85;
    }
    #fullscreen-btn:hover {
      background: rgba(14, 116, 144, 0.85);
      border-color: #00f0ff;
      color: #ffffff;
      opacity: 1;
      transform: scale(1.04);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
    }
    #fullscreen-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <button id="fullscreen-btn" title="全画面表示の切り替え (Fキー)">
    <svg id="fs-icon-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <svg id="fs-icon-exit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
      <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>
    </svg>
    <span id="fs-text">全画面 [F]</span>
  </button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
